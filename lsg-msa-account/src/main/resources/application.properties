spring.application.name=lsg-msa-account

# R2DBC
spring.r2dbc.url=${SECRET_CONFIG_DB_URL}
spring.r2dbc.username=${SECRET_CONFIG_DB_USERNAME}
spring.r2dbc.password=${SECRET_CONFIG_DB_PASSWORD}
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20

# Schema initialization
spring.sql.init.platform=postgresql
spring.sql.init.mode=always

# Server
server.port=${CONFIG_HTTP_HTTPS_PORT}

# External services
app.customers-api.base-url=${CUSTOMERS_API_BASE_URL}
app.customers-api.path=${CUSTOMERS_API_PATH}

# OpenAPI
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha


SECRET_CONFIG_DB_URL=r2dbc:postgresql://admin:admin123@localhost:5432/customers_db
SECRET_CONFIG_DB_PASSWORD=admin123
SECRET_CONFIG_DB_USERNAME=admin
CONFIG_HTTP_HTTPS_PORT=8080
ACCOUNT_API_BASE_URL=http://localhost:8081
ACCOUNT_API_EXISTS_ACTIVE_ACCOUNTS_PATH=/api/v1/accounts/exists?customerId={customerId}

