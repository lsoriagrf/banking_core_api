services:
  db:
    image: postgres:16-alpine
    pull_policy: if_not_present
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Guayaquil
      PGTZ: America/Guayaquil
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    pull_policy: if_not_present
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    pull_policy: if_not_present
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  lsg-msa-customer:
    build: ./lsg-msa-customer
    ports:
      - "8080:8080"
    environment:
      TZ: America/Guayaquil
      SECRET_CONFIG_DB_URL: ${CUSTOMER_DB_URL}
      SECRET_CONFIG_DB_USERNAME: ${DB_USERNAME}
      SECRET_CONFIG_DB_PASSWORD: ${DB_PASSWORD}
      CONFIG_HTTP_HTTPS_PORT: 8080
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_CUSTOMER_EVENTS: ${KAFKA_TOPIC_CUSTOMER_EVENTS}
      KAFKA_TOPIC_ACCOUNT_EVENTS: ${KAFKA_TOPIC_ACCOUNT_EVENTS}
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Guayaquil
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  lsg-msa-account:
    build: ./lsg-msa-account
    ports:
      - "8081:8081"
    environment:
      TZ: America/Guayaquil
      SECRET_CONFIG_DB_URL: ${ACCOUNT_DB_URL}
      SECRET_CONFIG_DB_USERNAME: ${DB_USERNAME}
      SECRET_CONFIG_DB_PASSWORD: ${DB_PASSWORD}
      CONFIG_HTTP_HTTPS_PORT: 8081
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_CUSTOMER_EVENTS: ${KAFKA_TOPIC_CUSTOMER_EVENTS}
      KAFKA_TOPIC_ACCOUNT_EVENTS: ${KAFKA_TOPIC_ACCOUNT_EVENTS}
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Guayaquil
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres_data: